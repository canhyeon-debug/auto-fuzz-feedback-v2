bus:
  interface: socketcan
  channel: can0

sender:
  bus_name: b_can
  dbc: ../A5.dbc
  output: logs/b_can_tx.jsonl
  output_policy: numbered

  # DBC: Blinkmodi_02, standard ID 0x366, 8 bytes
  message: Blinkmodi_02
  id: 0x366
  set:
    BM_Warnblinken: 1

  base:
    mode: live
    timeout_seconds: 5.0

  transmit:
    count: 1
    interval_ms: 100.0
    send_timeout_seconds: 1.0
    restore_original: true
    restore_count: 1
    restore_delay_ms: 100.0

  safety:
    max_count: 100
    min_interval_ms: 10.0
    allow_protected_dbc_patch: false
